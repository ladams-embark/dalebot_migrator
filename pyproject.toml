[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wdmigrator"
version = "0.1.0"
description = "Migrates calculated fields and report definitions between Workday tenants via the Core_Implementation_Service SOAP service"
requires-python = ">=3.10"

# zeep 4.3.3 is the version the Get_Calculated_Fields prototype was verified
# against offline (see HANDOFF.md). Do not downgrade without re-verifying.
dependencies = [
    "zeep>=4.3.3",
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "lxml>=5.2.2",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-dotenv>=0.5.2",
]
ui = [
    "streamlit>=1.40",
    "pandas>=2.2",
]

[project.scripts]
# Available as `wdmigrator ...` once cli.py exists (build plan step 6).
wdmigrator = "wdmigrator.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the local WSDL with the package so zeep can build a client offline.
wdmigrator = ["assets/*.xml"]

[tool.pytest.ini_options]
# `pythonpath` means tests import wdmigrator even before `pip install -e .`.
pythonpath = ["src"]
testpaths = ["tests"]

# THE IMPORTANT LINE: a bare `pytest` runs ONLY offline tests. Tests that touch
# a real tenant must be marked `live` and are excluded by default, so the fast
# inner loop never makes a network call.
addopts = "-m 'not live' --strict-markers -q"

markers = [
    "live: requires a real Workday tenant and a populated .env (deselected by default; run with `pytest -m live`)",
    "dest: touches the DESTINATION tenant (never write in tests; dry_run=True only)",
]
